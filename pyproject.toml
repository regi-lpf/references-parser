[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine-bib"
version = "1.0.0"
description = "Extrator bibliográfico enxuto e vitrine web empacotada para WordPress/Elementor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "lzstring>=1.0.4",
]

[dependency-groups]
dev = [
    "playwright>=1.45",
]

[project.scripts]
vitrine-bib = "vitrine_bib.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
