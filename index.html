<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine Bibliográfica — LEME / EPT</title>
  <link rel="stylesheet" href="frontend/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #eef1f8;
      font-family: "Open Sans", "Segoe UI", Arial, sans-serif;
      color: #111827;
    }
    .preview-switcher {
      max-width: 1120px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .preview-switcher button {
      border: 1px solid #c2c8ff;
      border-radius: 999px;
      background: #ffffff;
      color: #3b47e5;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .preview-switcher button[aria-pressed="true"] {
      background: #3b47e5;
      color: #ffffff;
      border-color: #3b47e5;
    }
    .preview-wrap {
      max-width: 1120px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="preview-switcher" role="navigation" aria-label="Selecionar coleção">
    <strong>Acervo:</strong>
    <button type="button" data-switch-lista="teses" aria-pressed="true">Teses e Dissertações</button>
    <button type="button" data-switch-lista="producao" aria-pressed="false">Produção Acadêmica</button>
    <button type="button" data-switch-lista="oficiais" aria-pressed="false">Documentos Oficiais</button>
  </div>
  <main class="preview-wrap">
    <section
      id="vitrine-bib"
      data-json-url="https://regi-lpf.github.io/references-parser/public/teses-dissertacoes.json"
      data-json-url-local="public/teses-dissertacoes.json"
      data-titulo="Teses e Dissertações"
      data-categoria-label="Grau"
    >
      <div class="vb-header">
        <h2 id="vb-title" class="vb-title">Teses e Dissertações</h2>
        <div class="vb-toolbar-actions">
          <a id="vb-download-json" href="public/teses-dissertacoes.json" download class="vb-btn">Baixar JSON</a>
          <button type="button" id="vb-download-csv" class="vb-btn">Baixar CSV</button>
        </div>
      </div>
      <div class="vb-search-row">
        <input type="search" id="vb-search" class="vb-search" placeholder="Buscar por título, autor ou instituição..." aria-label="Buscar referências">
        <button type="button" id="vb-clear" class="vb-clear">Limpar filtros</button>
      </div>
      <div class="vb-filters">
        <div class="vb-field">
          <label id="vb-categoria-label" for="vb-filter-categoria">Grau</label>
          <select id="vb-filter-categoria" aria-label="Filtrar por grau">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="vb-field">
          <label for="vb-filter-ano">Ano</label>
          <select id="vb-filter-ano" aria-label="Filtrar por ano">
            <option value="">Todos os anos</option>
          </select>
        </div>
        <label class="vb-toggle" for="vb-only-available">
          <input type="checkbox" id="vb-only-available">
          <span>Apenas com texto disponível</span>
        </label>
      </div>
      <div class="vb-toolbar">
        <div id="vb-stats" class="vb-count" aria-live="polite">Carregando acervo...</div>
      </div>
      <div id="vb-live-feedback" class="vb-sr-only" aria-live="polite"></div>
      <div id="vb-grid" class="vb-results"></div>
      <nav id="vb-pagination" class="vb-pagination" aria-label="Paginação"></nav>
    </section>
  </main>
  <script src="frontend/app.js"></script>
  <script>
    (function () {
      var presets = {
        teses: {
          prod: "https://regi-lpf.github.io/references-parser/public/teses-dissertacoes.json",
          local: "public/teses-dissertacoes.json",
          titulo: "Teses e Dissertações",
          cat: "Grau"
        },
        producao: {
          prod: "https://regi-lpf.github.io/references-parser/public/producao-academica.json",
          local: "public/producao-academica.json",
          titulo: "Produção Acadêmica",
          cat: "Tipo"
        },
        oficiais: {
          prod: "https://regi-lpf.github.io/references-parser/public/documentos-oficiais.json",
          local: "public/documentos-oficiais.json",
          titulo: "Documentos Oficiais e Legislação",
          cat: "Tipo"
        }
      };
      var nav = document.querySelector(".preview-switcher");
      var vitrine = document.getElementById("vitrine-bib");
      if (!nav || !vitrine) return;
      nav.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-switch-lista]");
        if (!btn) return;
        var key = btn.getAttribute("data-switch-lista");
        var cfg = presets[key];
        if (!cfg) return;
        nav.querySelectorAll("button").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        vitrine.setAttribute("data-json-url", cfg.prod);
        vitrine.setAttribute("data-json-url-local", cfg.local);
        vitrine.setAttribute("data-titulo", cfg.titulo);
        vitrine.setAttribute("data-categoria-label", cfg.cat);
        if (typeof vitrine.__vbReload === "function") vitrine.__vbReload();
      });
    })();
  </script>
</body>
</html>
